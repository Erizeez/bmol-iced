[package]
name = "liquid-glass-ui"
description = "UI-facing Liquid Glass components and builders for Iced."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "thread-pool", "svg", "image-without-codecs", "x11", "wayland"] }
liquid-glass-scene = { path = "../../../liquid-rs/crates/liquid-glass-scene", version = "0.1.0" }
squircle-rs = { path = "../../../squircle-rs", version = "0.1.1" }
bmol-designs = { path = "../../../bmol-designs", version = "0.1.0" }
bmol-window-shell = { path = "../../../bmol-window-shell/crates/bmol-window-shell", version = "0.1.0" }
spring-rs = { git = "https://github.com/Erizeez/spring-rs.git", tag = "v0.1.0" }
vibrancy-rs = { path = "../../../vibrancy-rs", version = "0.1.0" }

[lints]
workspace = true
