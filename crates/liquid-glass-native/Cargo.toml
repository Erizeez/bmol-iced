[package]
name = "liquid-glass-native"
description = "Small native window hooks used by Liquid Glass integrations."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-graphics = "0.23.2"
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFCGTypes",
    "CFString",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGContext",
    "CGImage",
    "CGPDFContext",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSNotification",
    "NSOperation",
    "NSString",
    "NSURL",
    "block2",
] }

# This crate is the intentionally isolated native FFI boundary. The rest of
# the workspace keeps the stricter `unsafe_code = "forbid"` policy.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
missing_docs = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
