[package]
name = "liquid-glass-native"
description = "Small native window hooks used by Liquid Glass integrations."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSResponder",
    "NSView",
    "NSWindow",
] }

# This crate is the intentionally isolated native FFI boundary. The rest of
# the workspace keeps the stricter `unsafe_code = "forbid"` policy.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
missing_docs = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
