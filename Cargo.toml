[workspace]
resolver = "2"
members = [
    "crates/bmol-iced",
    "crates/bmol-glass-iced",
    "crates/liquid-glass-ui",
    "examples/playground",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
authors = ["Erizeez <zhangyongcheng@sjtu.edu.cn>"]
repository = "https://github.com/Erizeez/bmol-iced"
homepage = "https://github.com/Erizeez/bmol-iced"
keywords = ["rust", "ui", "wgpu", "iced", "liquid-glass", "macos"]
categories = ["gui", "graphics", "rendering"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
